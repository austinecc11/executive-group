# executive-group<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Executive Custom Construction | Golden Eagle | Apex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Executive Custom Construction and partner brands Golden Eagle and Apex providing framing, coatings, and concrete services in Colorado." />
  <style>
    :root {
      --bg: #e5edf5;
      --surface: #ffffff;
      --surface-alt: #f3f6fb;
      --border-subtle: rgba(148, 163, 184, 0.35);
      --border-strong: rgba(148, 163, 184, 0.7);
      --text: #1f2933;
      --muted: #6b7280;
      --accent-primary: #4fc3f7; /* ECC sky blue */
      --accent-primary-dark: #0288d1; /* deeper ECC blue */
      --accent-golden: #f9a825;    /* sun gold */
      --accent-apex: #26a69a;      /* teal/green */
      --radius-lg: 20px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, #f0f7ff 0, #e5edf5 45%, #e5edf5 100%);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid rgba(209, 213, 219, 0.7);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .brand-logo {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 0.9rem;
      border: 1px solid rgba(148, 163, 184, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), #ffffff);
      color: #0b2537;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
    }

    .brand-title {
      font-size: 0.92rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    nav a {
      font-size: 0.86rem;
      text-decoration: none;
      color: var(--muted);
      margin-left: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    nav a:hover {
      color: var(--accent-primary-dark);
    }

    .pill-link {
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.7);
      background: #ffffff;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.8rem 1.5rem 3.5rem;
    }

    /* HERO */

    .hero {
      max-width: 980px;
      margin: 2.2rem auto 3rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.8rem 1.5rem 2.4rem;
      border-radius: 24px;
      background: linear-gradient(to bottom right, #ffffff, #f3f7fd);
      border: 1px solid rgba(209, 213, 219, 0.8);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    .hero-logos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.4rem;
      margin-bottom: 1.8rem;
    }

    .hero-logo-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      width: clamp(160px, 25vw, 220px);
      padding: 0.9rem 1.1rem 1.1rem;
      border-radius: 18px;
      border: 1px solid rgba(209, 213, 219, 0.9);
      background: #ffffff;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .hero-logo-badge.exec {
      border-color: rgba(2, 136, 209, 0.7);
    }

    .hero-logo-badge.gold {
      border-color: rgba(249, 168, 37, 0.7);
    }

    .hero-logo-badge.apex {
      border-color: rgba(38, 166, 154, 0.7);
    }

    .hero-logo-badge:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.09);
      border-color: var(--border-strong);
      background: #f9fbff;
    }

    .hero-logo-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1; /* perfect square */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.55rem;
    }

    .hero-logo-badge img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      padding: 10px;
    }

    .hero-logo-title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 0.1rem;
    }

    .hero-logo-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.38rem 0.9rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(191, 219, 254, 0.9);
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.1rem;
      background: #f5f9ff;
    }

    .hero-badge span {
      width: 0.32rem;
      height: 0.32rem;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
    }

    .hero h1 {
      font-size: clamp(2.3rem, 3.2vw + 1.3rem, 3.1rem);
      line-height: 1.05;
      margin: 0 0 0.85rem;
      color: #111827;
    }

    .hero h1 span {
      background: linear-gradient(to right, var(--accent-primary-dark), var(--accent-primary));
      -webkit-background-clip: text;
      color: transparent;
    }

    .hero p {
      margin: 0;
      font-size: 1.02rem;
      color: #4b5563;
      max-width: 38rem;
      line-height: 1.7;
    }

    .hero-secondary-line {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .hero-cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      margin-top: 1.6rem;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      border-radius: var(--radius-pill);
      border: none;
      padding: 0.82rem 1.7rem;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(to right, var(--accent-primary-dark), var(--accent-primary));
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-primary:hover {
      filter: brightness(1.03);
    }

    .btn-ghost {
      border-radius: var(--radius-pill);
      border: 1px solid rgba(148, 163, 184, 0.7);
      padding: 0.78rem 1.4rem;
      font-size: 0.86rem;
      background: #ffffff;
      color: var(--muted);
      cursor: pointer;
    }

      border-color: var(--accent-primary-dark);
      color: var(--accent-primary-dark);
